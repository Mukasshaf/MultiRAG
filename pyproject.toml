[project]
name = "multilingual-rag"
version = "0.1.0"
description = "Multi-document multilingual RAG system with Ollama + Pinecone"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.0",

    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",

    "pypdf>=4.3.0",
    "pymupdf>=1.24.0",
    "docx2txt>=0.8",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "unstructured>=0.14.0",

    "sentence-transformers>=3.0.0",

    "pinecone>=5.0.0",

    "ollama>=0.3.0",

    "langdetect>=1.0.9",

    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
